# nginx 反代配置（阶段 11.6 切片 E #100）
#
# 用途：
# - HTTP server block（监听 80）：服务 Let's Encrypt webroot challenge + HTTP→HTTPS 301 重定向
# - HTTPS server block（监听 443）：TLS 终止 + 反代 api 容器（http://api:8000）
#
# 模板变量（由 docker/nginx/entrypoint.sh 用 envsubst 替换）：
# - ${DOMAIN}：签发证书的域名（如 api.example.com），由 compose 环境变量 DOMAIN 注入
#
# 与 Let's Encrypt 配合：
# - webroot 模式：certbot 容器把 challenge 响应写到 /var/www/certbot（共享卷），
#   nginx 通过 /.well-known/acme-challenge/ 路径对外服务 challenge。
# - 续期：certbot 容器 cron 周期运行 certbot renew，nginx 容器 cron 周期 nginx -s reload
#   读取续期后的新证书。
# - 首次启动：nginx 容器 entrypoint 检测 fullchain.pem 不存在时生成 1 天有效的占位自签证书，
#   让 nginx SSL server block 能加载配置启动（certbot 首次签发后才替换为真实证书）。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 反代到 api 容器时转发真实客户端信息
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP server（监听 80）：Let's Encrypt webroot challenge + HTTP→HTTPS 301 重定向
    server {
        listen 80;
        server_name ${DOMAIN};

        # Let's Encrypt webroot challenge 路径
        # certbot 把 challenge 响应写到 /var/www/certbot/.well-known/acme-challenge/<token>
        # nginx 通过此 location 把该路径下的文件对外服务
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 非 challenge 路径全部 301 重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server（监听 443）：TLS 终止 + 反代 api 容器
    server {
        listen 443 ssl;
        server_name ${DOMAIN};

        # SSL 证书路径（Let's Encrypt 默认目录）
        # 首次启动时 entrypoint 生成占位自签证书；certbot 签发后替换为真实证书
        ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        # 反代 api 容器（docker network 内 http://api:8000）
        location / {
            proxy_pass http://api:8000;
        }
    }
}
