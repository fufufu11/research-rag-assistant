[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-rag-assistant"
version = "0.0.0"
description = "科研文献可溯源智能问答系统"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "fufufu11" }]
keywords = ["rag", "llm", "pdf", "qa", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# 业务依赖按阶段逐步引入。阶段 1 引入 PyMuPDF 用于按页解析 PDF。
dependencies = [
    # 阶段 5 引入：SQLAlchemy 官方迁移工具，schema 演进必须可控
    # （阶段 5+ 会加 QueryLog 表、可能调整字段）。
    # 必要性：alembic 是 SQLAlchemy 官方迁移工具，与 ORM 同源，支持
    # autogenerate 对比模型与数据库差异生成迁移脚本。
    # 替代方案：① Base.metadata.create_all → 只建不改，无法演进；
    # ② 手写 SQL 迁移 → 不可控、易出错、跨数据库不兼容。
    "alembic>=1.13",
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-huggingface>=1.2.2",
    # 阶段 4 引入：LangChain 官方维护的 OpenAI 兼容客户端。
    # 必要性：所有 OpenAI 兼容服务（DeepSeek、Moonshot、Together、本地 vLLM 等）
    # 都用同一个 ChatOpenAI 类，与已装的 langchain-huggingface 风格一致。
    # 替代方案：① 直接用 openai SDK → 失去 BaseChatModel 抽象；
    # ② langchain-community.ChatOpenAI → community 体积大；③ 手写 HTTP → 违反
    # PROJECT_PLAN 第 5.1 节"直接使用 LangChain"。
    "langchain-openai>=1.2.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.6",
    "pymupdf>=1.28.0",
    # 阶段 5 引入：ORM 与数据库抽象层，PROJECT_PLAN 第 5 节选型。
    # 必要性：2.0 的 Mapped/mapped_column 提供类型安全的字段定义；
    # Session 抽象让业务代码与 SQL 解耦，便于切换 SQLite → PostgreSQL。
    # 替代方案：① SQLModel → 多一层 Pydantic 抽象，学习时增加复杂度；
    # ② Tortoise ORM → 异步优先但生态小；③ 裸 SQL → 违反 PROJECT_PLAN
    # 第 2.2 节"数据模型、事务和数据库迁移"学习目标。
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pre-commit>=3.8",
]
# 本地 Embedding 模型推理后端（阶段 3）。
# 运行评测脚本的真实模式前需 `uv sync --extra embedding`；
# 单元测试用确定性 FakeEmbeddings，CI 仅 `uv sync --extra dev`，无需安装此 extra。
embedding = [
    "sentence-transformers>=2.7",
]

[project.urls]
Homepage = "https://github.com/fufufu11/research-rag-assistant"
Repository = "https://github.com/fufufu11/research-rag-assistant"

# ---------------------------------------------------------------------------
# Hatchling 构建配置：src 布局
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/research_rag"]

# ---------------------------------------------------------------------------
# Ruff：格式化 + 静态检查
# 配置依据 PROJECT_PLAN.md 第 5 节、第 13.4 节
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行长由 formatter 控制
    "RUF001", # 中文排版允许全角标点（歧义字符检测对中文项目误报）
    "RUF002", # 同上，docstring 中的全角标点
    "RUF003", # 同上，注释中的全角标点
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # 测试中允许 assert False

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy：静态类型检查
# 仅检查 src，参考第 13.4 节
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
files = ["src"]
# uv 管理的独立 Python 的 _sqlite3.dll 在本机被应用程序控制策略阻止，
# mypy 默认用 sqlite 做增量缓存会触发 ImportError，故关闭增量检查。
# 对当前项目规模无影响，后续若迁移到系统级 Python 可移除此项。
no_incremental = true

# 测试目录放宽严格度
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# uv 配置
# ---------------------------------------------------------------------------
[tool.uv]
managed = true
