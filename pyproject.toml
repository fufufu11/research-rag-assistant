[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-rag-assistant"
version = "0.0.0"
description = "科研文献可溯源智能问答系统"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "fufufu11" }]
keywords = ["rag", "llm", "pdf", "qa", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# 业务依赖按阶段逐步引入。阶段 1 引入 PyMuPDF 用于按页解析 PDF。
dependencies = [
    "pymupdf>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/fufufu11/research-rag-assistant"
Repository = "https://github.com/fufufu11/research-rag-assistant"

# ---------------------------------------------------------------------------
# Hatchling 构建配置：src 布局
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/research_rag"]

# ---------------------------------------------------------------------------
# Ruff：格式化 + 静态检查
# 配置依据 PROJECT_PLAN.md 第 5 节、第 13.4 节
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行长由 formatter 控制
    "RUF001", # 中文排版允许全角标点（歧义字符检测对中文项目误报）
    "RUF002", # 同上，docstring 中的全角标点
    "RUF003", # 同上，注释中的全角标点
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # 测试中允许 assert False

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy：静态类型检查
# 仅检查 src，参考第 13.4 节
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
files = ["src"]
# uv 管理的独立 Python 的 _sqlite3.dll 在本机被应用程序控制策略阻止，
# mypy 默认用 sqlite 做增量缓存会触发 ImportError，故关闭增量检查。
# 对当前项目规模无影响，后续若迁移到系统级 Python 可移除此项。
no_incremental = true

# 测试目录放宽严格度
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# uv 配置
# ---------------------------------------------------------------------------
[tool.uv]
managed = true
