[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-rag-assistant"
version = "0.0.0"
description = "科研文献可溯源智能问答系统"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "fufufu11" }]
keywords = ["rag", "llm", "pdf", "qa", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# 业务依赖按阶段逐步引入。阶段 1 引入 PyMuPDF 用于按页解析 PDF。
dependencies = [
    # 阶段 5 引入：SQLAlchemy 官方迁移工具，schema 演进必须可控
    # （阶段 5+ 会加 QueryLog 表、可能调整字段）。
    # 必要性：alembic 是 SQLAlchemy 官方迁移工具，与 ORM 同源，支持
    # autogenerate 对比模型与数据库差异生成迁移脚本。
    # 替代方案：① Base.metadata.create_all → 只建不改，无法演进；
    # ② 手写 SQL 迁移 → 不可控、易出错、跨数据库不兼容。
    "alembic>=1.13",
    # Web 框架：基于 Starlette + Pydantic，原生支持类型标注驱动的参数校验、
    # 依赖注入和 OpenAPI 文档；UploadFile / Form / APIRouter 直接覆盖
    # 文档上传/列表/详情/删除需求。
    # 替代方案：① Flask + Flask-RESTful → 无原生类型校验和异步支持；
    # ② Litestar → 生态小；③ 手写 ASGI → 重复造轮子。
    "fastapi>=0.115",
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-huggingface>=1.2.2",
    # LangChain 官方维护的 OpenAI 兼容客户端。
    # 必要性：所有 OpenAI 兼容服务（DeepSeek、Moonshot、Together、本地 vLLM 等）
    # 都用同一个 ChatOpenAI 类，与已装的 langchain-huggingface 风格一致。
    # 替代方案：① 直接用 openai SDK → 失去 BaseChatModel 抽象；
    # ② langchain-community.ChatOpenAI → community 体积大；③ 手写 HTTP →
    # 失去 LangChain 统一抽象。
    "langchain-openai>=1.2.0",
    # LangChain 官方 Qdrant 集成，支持持久化向量存储与 Payload 过滤。
    # 必要性：QdrantVectorStore 实现 VectorStore 接口，与 embedding.py 的
    # index_chunks/retrieve 兼容；支持按 document_id payload 过滤检索和批量删除，
    # 满足"删除文档后无残留向量"验收标准。
    # 替代方案：① 直接用 qdrant-client → 失去 LangChain VectorStore 抽象；
    # ② Chroma → 生态相近但 Qdrant Payload 过滤更灵活。
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.6",
    "pymupdf>=1.28.0",
    # 阶段 5 引入：FastAPI 的 UploadFile / Form 解析 multipart/form-data 的硬性依赖。
    # 必要性：FastAPI 实现文件上传端点（POST /documents）时，缺少 python-multipart
    # 会直接抛 RuntimeError: Form data requires "python-multipart"。
    # 替代方案：无（这是 FastAPI 的硬性要求，非可选）。
    "python-multipart>=0.0.18",
    # 阶段 6 引入：HTTP 客户端，供 Streamlit UI 层调用 FastAPI API。
    # 必要性：requests 是同步 HTTP 客户端，与 Streamlit 的同步执行模型匹配，
    # API 简单直观，便于在单元测试中用 monkeypatch 替换。
    # 替代方案：① httpx → 已作为 TestClient 传递依赖存在，但同步/异步 API
    # 混用增加学习成本；② urllib → 标准库但 API 冗长，无自动 JSON 解析。
    "requests>=2.32",
    # 阶段 8.3 引入：BM25 稀疏检索，与向量检索融合（Hybrid Retrieval）。
    # 必要性：rank_bm25 是纯 Python 实现的 BM25Okapi，无重依赖（不依赖 torch），
    # 体积小（约 50KB），适合生产路径默认启用。对关键词列表、数值、公式类
    # 问题（向量检索弱项）有天然优势，与向量检索互补。
    # 替代方案：① bm25s → 性能更好但依赖 C 扩展；② 自实现 BM25 → 重复造轮子。
    "rank-bm25>=0.2.2",
    # ORM 与数据库抽象层：2.0 的 Mapped/mapped_column 提供类型安全的字段定义；
    # Session 抽象让业务代码与 SQL 解耦，便于切换 SQLite → PostgreSQL。
    # 替代方案：① SQLModel → 多一层 Pydantic 抽象，增加复杂度；
    # ② Tortoise ORM → 异步优先但生态小；③ 裸 SQL → 失去类型安全与迁移工具。
    "sqlalchemy>=2.0",
    # 演示界面框架：Streamlit 适合数据/AI 应用的快速原型，内置文件上传、表格、
    # 文本输入等组件，无需前端构建工具链即可跑通浏览器交互流程。
    # 替代方案：① Gradio → 同类但交互模型偏 ML demo；② 纯 HTML+JS →
    # 需要前端构建；③ FastAPI 模板 → 静态。
    "streamlit>=1.40",
    # 阶段 5 引入：ASGI 服务器，运行 FastAPI 应用。
    # 必要性：FastAPI 本身只是 ASGI 应用，需要 ASGI 服务器才能启动；
    # `uv run uvicorn research_rag.api.app:create_app --factory --reload` 启动开发服务必需。
    # 替代方案：① hypercorn → 同为 ASGI，无明显优势；
    # ② gunicorn → 不直接支持 ASGI（需 uvicorn worker，Windows 也不支持 fork）。
    # uvicorn 是 FastAPI 官方推荐，本 Issue 必需。
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # starlette 1.x 的 TestClient 弃用 httpx，改用 httpx2。
    # 必要性：fastapi.testclient.TestClient 底层用 starlette.testclient，
    # starlette 1.3.1 首选 ``import httpx2``，缺失时 fallback 到 httpx 并抛
    # StarletteDeprecationWarning（被 pytest filterwarnings=error 升级为错误）。
    # 替代方案：降级 starlette → 失去 fastapi 0.139 兼容；忽略 warning → 治标不治本。
    "httpx2>=0.27",
    "pre-commit>=3.8",
]
# 本地 Embedding 模型推理后端（阶段 3）。
# 运行评测脚本的真实模式前需 `uv sync --extra embedding`；
# 单元测试用确定性 FakeEmbeddings，CI 仅 `uv sync --extra dev`，无需安装此 extra。
embedding = [
    "sentence-transformers>=2.7",
]
# 中文分词后端（阶段 8.3 引入）。
# BM25 对中文需 jieba 分词才能正确切词；英文场景下用空格切分即可，无需此 extra。
# 运行中文评测或本地启用 BM25 中文场景时需 `uv sync --extra chinese`；
# 未安装时 BM25Retriever 自动 fallback 到字符级切分（精度降低但可用）。
chinese = [
    "jieba>=0.42.1",
]

[project.urls]
Homepage = "https://github.com/fufufu11/research-rag-assistant"
Repository = "https://github.com/fufufu11/research-rag-assistant"

# ---------------------------------------------------------------------------
# Hatchling 构建配置：src 布局
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/research_rag"]

# ---------------------------------------------------------------------------
# Ruff：格式化 + 静态检查
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行长由 formatter 控制
    "RUF001", # 中文排版允许全角标点（歧义字符检测对中文项目误报）
    "RUF002", # 同上，docstring 中的全角标点
    "RUF003", # 同上，注释中的全角标点
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # 测试中允许 assert False
# FastAPI / Pydantic 需要运行时访问类型：
# - FastAPI 通过类型注解识别 Request（依赖注入）、uuid.UUID（路径参数转换）
# - Pydantic 模型字段类型运行时必须可访问（uuid/datetime/enum）
# - FastAPI 惯例在参数默认值调用 File()/Depends()（B008）
# ruff 的 TC001/TC002/TC003 会误判这些导入"仅用于类型标注"而建议移入
# TYPE_CHECKING 块，移入后会导致运行时 NameError，故在 api 层忽略。
"src/research_rag/api/**" = ["TC001", "TC002", "TC003", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy：静态类型检查（仅检查 src）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
files = ["src"]
# uv 管理的独立 Python 的 _sqlite3.dll 在本机被应用程序控制策略阻止，
# mypy 默认用 sqlite 做增量缓存会触发 ImportError，故关闭增量检查。
# 对当前项目规模无影响，后续若迁移到系统级 Python 可移除此项。
no_incremental = true

# 测试目录放宽严格度
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict = false

# Streamlit 的类型标注不完整（部分 API 缺少类型信息），忽略缺失导入避免 CI 误报。
# 仅影响 ui/app.py（演示界面入口），不影响业务代码类型安全。
[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

# sentence_transformers 是可选依赖（embedding extra），CI 只装 dev extra 不装它，
# 且该库无 type stubs。reranker.py 在运行时惰性导入 CrossEncoder，mypy 静态检查
# 时找不到该模块会报 import-not-found。与 streamlit 同理，忽略缺失导入。
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

# rank_bm25 和 jieba 是可选/轻量依赖。rank_bm25 在主依赖中但无 type stubs；
# jieba 是可选依赖（chinese extra），CI 不强制安装。两者运行时惰性导入，
# mypy 静态检查时找不到模块会报 import-not-found，忽略避免 CI 误报。
[[tool.mypy.overrides]]
module = ["rank_bm25.*", "jieba.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# uv 配置
# ---------------------------------------------------------------------------
[tool.uv]
managed = true
